name: Validate Move

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
      - name: Install FFmpeg and Chinese subtitle fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install Python dependencies
        run: uv sync --directory apps/api --frozen --group dev --python 3.12
      - name: Check and test
        working-directory: apps/api
        run: |
          uv run ruff check move_app tests ../../workers/tts/synthesize.py
          uv run pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: uv sync --directory apps/api --frozen --python 3.12
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
